<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login - Lumos</title>
</head>
<body>
    <div class="login-box">
        <div class="slogan">
            <img src="imagens/slogan.png" alt="slogan do Lumos" class="logo-img">
            <h1 class="nome-empresa">Lumos</h1>
            <p class="sublogo">REDE E INTEGRIDADE</p>
        </div>
        
        <form>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="operador@gmail.com.br" ><br>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="**********" ><br>
                <a href="#" class="esqueci-senha">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <!-- Divisória com texto entre as linhas -->
        <div class="divisoria">
             <span>ACESSO RESTRITO</span><br>
        </div>
        <!-- Texto de suporte com link -->
            <p class="suporte">
             Problemas para acessar? <a href="#" class="link-supeorte">Fale com o suporte</a>
             </p>
    </div>

</body>
</html>
